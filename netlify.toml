# Davis Roofing & Exteriors: Netlify config (Nov 2026 SEO update)
# Preferred URLs: "/" for home and "/page.html" for every other page, matching the
# canonicals and sitemap Google already has. Netlify keeps query strings on redirects,
# so ad and campaign parameters survive. force = true is needed because Netlify would
# otherwise serve the matching file with a 200 instead of redirecting.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

